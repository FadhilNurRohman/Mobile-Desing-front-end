<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>

</head>


<body>


    <header class="user-header">

            <div class="user-profile">

                <div class="profile-avatar">
                    DP
                </div>

                <div class="profile-info">

                    <p class="greeting">
                        Selamat Pagi.
                    </p>

                    <h1 class="user-name">
                        Dina Putri
                    </h1>

                </div>
    
            </div>

            <button class="notification-btn" type="button" aria-label="notifikasi">

                <svg

                    xmlns="http://www.w3.org/2000/svg"
                    width="24"
                    height="24"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    class="feather feather-bell">
                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                    <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>

                </svg>

            </button>

    </header>

    <section class="balance-card">

        <div class="balance-header">
            
            <h2>Total Saldo</h2>
           
            <button class="balance-toggle" id="toggle-balance" type="button" aria-label="Sembunyikan saldo">

                <svg
                
                    xmlns="http://www.w3.org/2000/svg"
                    width="28"
                    height="28"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round">

                    <!-- Garis luar mata -->
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>

                    <!-- Lingkaran bagian tengah mata -->
                    <circle cx="12" cy="12" r="3"></circle>

                </svg>

            </button>    

        </div>

        <h1 class="balance-amount" id="balance-amount">
            Rp 5.680.250
        </h1>

        <div class="balance-footer">

            <p class="balance-status">Akun Premium</p>

            <span class="balance-growth">
                +12% dari bulan lalu
            </span>

        </div>

    </section>

</body>


</html>
